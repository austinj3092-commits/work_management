<script>
const $=id=>document.getElementById(id),E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),U=()=>Math.random().toString(36).slice(2,9),RC=()=>''+(10000+Math.floor(Math.random()*90000));
const today=()=>new Date().toLocaleDateString('en-CA'),fmt=d=>d?new Date(d+'T00:00').toLocaleDateString(undefined,{day:'numeric',month:'short'}):'No date',avg=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):0;

async function H(s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('pc'+s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let x=5381;for(const c of s)x=x*33^c.charCodeAt(0);return'f'+x}}
let WS=L('pc_ws')||[],S={w:null,d:null,v:'dash',pid:null,sort:'due',fp:'all',open:{}};
document.documentElement.dataset.theme=L('pc_theme')||'dark';const sv=()=>W('pc_d_'+S.w.id,S.d),svw=()=>W('pc_ws',WS);
function M(title,fields,cb,ok='Save'){const m=document.createElement('div');m.className='md';
m.innerHTML=`<form><b style="font:600 18px var(--fh)">${E(title)}</b>${fields.map(f=>`<label>${f.l}${f.o?`<select name="${f.k}">${f.o.map(o=>`<option value="${E(o[0])}" ${o[0]==f.v?'selected':''}>${E(o[1])}</option>`).join('')}</select>`:f.t=='textarea'?`<textarea name="${f.k}" rows="3" style="resize:vertical;font:inherit;color:inherit;background:var(--p2);border:1px solid var(--ln);border-radius:9px;padding:9px 11px">${E(f.v)}</textarea>`:`<input name="${f.k}" type="${f.t||'text'}" value="${E(f.v)}" ${f.t=='number'?'min=0':''} autocomplete="off">`}</label>`).join('')}<div class="tb" style="margin:6px 0 0"><button class="bt">${ok}</button><button type="button" class="x">Cancel</button></div></form>`;
document.body.appendChild(m);const f=m.querySelector('form');f.querySelector('input,select')?.focus();m.querySelector('.x').onclick=()=>m.remove();f.onsubmit=async e=>{e.preventDefault();if(await cb(Object.fromEntries(new FormData(f)))!==false)m.remove()}}
// ---- login
function login(msg=''){S.w=null;$('a').innerHTML=WS.length?`<form class="box" id="lf"><div class="br" style="margin:0"><div class="bm">PC</div><div><b>PROJECT CONTROL</b><small>SIGN IN</small></div></div><label class="mu">Workspace<select id="ws" style="width:100%">${WS.map(w=>`<option value="${w.id}">${E(w.name)}</option>`).join('')}</select></label><label class="mu">Password<input id="pw" type="password" style="width:100%" autofocus></label><div class="dg">${msg}</div><button class="bt">Enter</button><div class="tb" style="margin:0"><button type="button" onclick="resetPw()">Forgot password?</button><button type="button" onclick="newWs()">+ New workspace</button></div></form>`:`<div class="box"><h1>Welcome 👋</h1><p class="mu">Create your first workspace. Each person gets their own projects and password.</p><button class="bt" onclick="newWs()">Create workspace</button></div>`;

function resetPw(){if(!WS.length)return alert('No workspace yet');M('Reset password',[{k:'w',l:'Workspace',o:WS.map(w=>[w.id,w.name])},{k:'c',l:'5-digit recovery code'},{k:'p',l:'New password',t:'password'}],async v=>{const w=WS.find(x=>x.id==v.w);if(w.r!==await H(v.c.trim().toUpperCase()))return alert('Wrong recovery code — if you made this workspace in an older version, use "No working code? Reset on this device" below.'),false;if(v.p.length<4)return alert('4+ characters'),false;w.h=await H(v.p);svw();alert('Password changed. Your data is untouched.');login()},'Reset')}
// ---- progress (task & subtask share one shape)
const sp=o=>o.mode=='qty'?(+o.tq?Math.min(100,Math.round(o.q/o.tq*100)):0):Math.min(100,+o.pct||0),tp=t=>t.subs?.length?avg(t.subs.map(sp)):sp(t),pp=p=>avg(p.tasks.map(tp));
const stn=n=>n>=100?'Done':n>0?'In progress':'To do',late=t=>t.due&&t.due<today()&&tp(t)<100,P=id=>S.d.projects.find(p=>p.id==id),T=(p,t)=>P(p).tasks.find(x=>x.id==t),O=(p,t,s)=>s?T(p,t).subs.find(x=>x.id==s):T(p,t);
function setP(o,n){if(o.subs?.length)o.subs.forEach(s=>setP(s,n));else if(o.mode=='qty')o.q=Math.round(o.tq*n/100);else o.pct=n}
const pst=p=>{const n=pp(p);return n>=100?['Done','s2']:p.due&&p.due<today()?['Overdue','s3']:n>0?['On track','s1']:['Not started','s0']};
// ---- layout
function render(){const v=S.v,nv=[['dash','◧','Dashboard'],['proj','▤','Projects'],['task','✓','All Tasks'],['single','•','Single Tasks'],['ideas','✦','Ideas'],['set','⚙','Settings']],ttl={dash:'Dashboard',proj:'Projects',p:'Project',task:'All Tasks',single:'Single Tasks',ideas:'Ideas',idea:'Idea',set:'Settings'}[v];
$('a').innerHTML=`<aside class="sb"><div class="br"><div class="bm">PC</div><div><b>PROJECT CONTROL</b><small>WORKSPACE</small></div></div><div class="wsb"><div class="wi">${E(S.w.name[0]||'W')}</div><div><b>${E(S.w.name)}</b><small>${E(S.w.owner)}</small></div></div>${nv.map(n=>`<button class="nv ${v==n[0]||(v=='p'&&n[0]=='proj')||(v=='idea'&&n[0]=='ideas')?'on':''}" onclick="go('${n[0]}')"><i>${n[1]}</i><span>${n[2]}</span></button>`).join('')}<button class="nv lk" onclick="login()"><i>🔒</i><span>Lock</span></button></aside><main><header class="tp"><span><b>${E(S.w.name)}</b> <span class="mu">/ ${ttl}</span></span><div class="av">${E(S.w.owner.slice(0,2).toUpperCase())}</div></header><div class="ct">${{dash,proj,task,p:pj,set,single:singleV,ideas:ideasV,idea:ideaV}[v]()}</div></main>`}
const PX={};const tpx=id=>{PX[id]=!PX[id];render()},allT=(p,o)=>{P(p).tasks.forEach(t=>S.open[t.id]=o);render()};

const ring=(n,s=64)=>`<div class="ring" style="--p:${n};--s:${s}px"><b>${n}%</b></div>`;
function dash(){const ps=S.d.projects,all=ps.flatMap(p=>p.tasks.map(t=>({t,p}))),dn=all.filter(x=>tp(x.t)>=100),od=all.filter(x=>late(x.t)),ip=all.filter(x=>tp(x.t)>0&&tp(x.t)<100&&!late(x.t)),tdo=all.length-dn.length-od.length-ip.length,dt=all.filter(x=>tp(x.t)<100&&x.t.due&&x.t.due<=today()),ov=avg(ps.map(pp));
